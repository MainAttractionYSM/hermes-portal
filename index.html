<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Portal | AI Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0a0c;
            --bg-panel: rgba(20, 20, 25, 0.7);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-main: #e2e8f0;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        .glass {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-bubble-user {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 18px 18px 2px 18px;
        }
        .chat-bubble-ai {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px 18px 18px 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .glow-input:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            outline: none;
        }
    </style>
</head>
<body class="flex h-full overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-72 glass h-full flex flex-col transition-all duration-300 hidden md:flex">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fas fa-bolt text-white text-sm"></i>
            </div>
            <h1 class="font-bold text-xl tracking-tight">Hermes <span class="text-blue-500">Portal</span></h1>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar px-4 py-2 space-y-2">
            <div class="text-xs font-semibold text-gray-500 uppercase px-4 py-4 tracking-widest">Recent Sessions</div>
            <div class="p-3 rounded-xl glass hover:bg-white/5 cursor-pointer transition-all flex items-center gap-3 group">
                <i class="fas fa-comment-alt text-gray-400 group-hover:text-blue-400 transition-colors"></i>
                <span class="text-sm truncate">Po-bot Optimization</span>
            </div>
            <div class="p-3 rounded-xl hover:bg-white/5 cursor-pointer transition-all flex items-center gap-3 group">
                <i class="fas fa-comment-alt text-gray-400 group-hover:text-blue-400 transition-colors"></i>
                <span class="text-sm truncate">Web UI Design</span>
            </div>
        </div>

        <div class="p-4 border-t border-white/10 glass">
            <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 cursor-pointer transition-all">
                <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold">MA</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-sm font-medium truncate">MainAttractionYSM</p>
                    <p class="text-xs text-gray-500">Online</p>
                </div>
                <i class="fas fa-cog text-gray-400 hover:text-white transition-colors"></i>
            </div>
        </div>
    </aside>

    <!-- MAIN CHAT -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Top Header -->
        <header class="h-16 glass px-6 flex items-center justify-between z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-400"><i class="fas fa-bars"></i></button>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-sm font-medium text-gray-300">Gemma 4 - Cloud</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-search"></i></button>
                <button class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 custom-scrollbar pb-24">
            <!-- AI Message -->
            <div class="flex gap-4 max-w-4xl mx-auto">
                <div class="w-8 h-8 rounded-lg bg-blue-600 flex-shrink-0 flex items-center justify-center text-xs font-bold shadow-lg shadow-blue-600/20">H</div>
                <div class="chat-bubble-ai p-4 text-sm leading-relaxed shadow-sm">
                    Welcome back. I've initialized your <strong>Cyber-Minimalist</strong> portal. You can now send messages, upload files, and manage your agents from this interface.
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 w-full p-4 md:p-6 bg-gradient-to-t from-black via-black to-transparent">
            <div class="max-w-4xl mx-auto relative">
                
                <!-- Upload Button (Hidden Trigger) -->
                <input type="file" id="file-upload" class="hidden" multiple />
                
                <div class="glass rounded-2xl p-2 flex items-end gap-2 glow-input transition-all duration-300">
                    <button onclick="document.getElementById('file-upload').click()" class="p-3 text-gray-400 hover:text-blue-400 transition-colors rounded-xl hover:bg-blue-500/10">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    
                    <textarea id="user-input" rows="1" placeholder="Message Hermes..." 
                        class="flex-1 bg-transparent border-none resize-none p-3 text-sm focus:ring-0 custom-scrollbar overflow-hidden"
                        oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>

                    <button id="send-btn" class="p-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-all shadow-lg shadow-blue-600/30 active:scale-95">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>

                <!-- File Preview Area -->
                <div id="file-preview" class="absolute bottom-full left-0 w-full mb-2 flex gap-2 overflow-x-auto p-2 hidden">
                    <!-- Previews injected here -->
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
